<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Produktion</title>
</head>
<body>
<style>
  html,body{margin:0;padding:0;height:100%;background:#334155;overflow:hidden;color:#F8F9FA;}
  *{box-sizing:border-box;}
  button,input,textarea,select{
    font-family:'Switzer','Inter','Helvetica Neue',system-ui,-apple-system,'Segoe UI',sans-serif;
    font-size:inherit;color:inherit;background:none;border:none;margin:0;
    -webkit-appearance:none;appearance:none;
  }
  button{cursor:pointer;}
  :focus-visible{outline:2px solid #35A5DB;outline-offset:2px;border-radius:4px;}
  :root{
    --bg:#334155; --surface:#3B4A61; --surface-2:#44546E; --deep:#2A3446;
    --line:rgba(248,249,250,.13); --line-strong:rgba(248,249,250,.28);
    --ink:#F8F9FA; --dim:rgba(248,249,250,.62); --faint:rgba(248,249,250,.36);
    --brand:#302B94;
    --s1:#8B5CF6; --s2:#6366F1; --s3:#35A5DB; --s4:#1FB8A6; --s5:#35C77E;
    --u:#F0A93B; --j:#E8719A;
    --s1rgb:139,92,246; --s2rgb:99,102,241; --s3rgb:53,165,219;
    --s4rgb:31,184,166; --s5rgb:53,199,126;
    --gutter:#232C3C;
    --sans:'Switzer','Inter','Helvetica Neue',system-ui,-apple-system,'Segoe UI',sans-serif;
  }
  #app{position:fixed;inset:0;display:flex;flex-direction:column;
       font-family:var(--sans);background:var(--bg);color:var(--ink);
       line-height:1.45;-webkit-font-smoothing:antialiased;}

  /* Kopfleiste */
  .bar{display:flex;align-items:center;gap:22px;padding:12px 20px;
       border-bottom:1px solid var(--line);background:var(--deep);flex:none;flex-wrap:wrap;}
  .meter{display:flex;align-items:center;gap:13px;flex:none;}
  .count{font-size:34px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em;}
  .count span{font-size:17px;color:var(--faint);font-weight:400;}
  .bars{display:flex;gap:4px;}
  .bar-i{width:22px;height:8px;border-radius:2px;background:rgba(248,249,250,.12);
         border:1px solid var(--line);transition:background .25s;}
  .bar-i.on{background:var(--s5);border-color:var(--s5);}
  .wk{font-size:12px;color:var(--dim);line-height:1.35;}
  .wk b{display:block;color:var(--ink);font-weight:500;}
  .rail{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-left:auto;}
  .drv{display:flex;align-items:center;gap:7px;padding:6px 12px;border-radius:7px;
       background:var(--surface);border:1px solid var(--line);font-size:12.5px;
       text-decoration:none;color:var(--ink);}
  .drv:hover{background:var(--surface-2);border-color:var(--line-strong);}
  .drv i{width:6px;height:6px;border-radius:50%;background:var(--s3);flex:none;}
  .drv.empty{color:var(--dim);} .drv.empty i{background:var(--faint);}
  .lnkbtn{font-size:12.5px;color:var(--dim);padding:6px 8px;}
  .lnkbtn:hover{color:var(--ink);}
  .arcbtn{display:flex;align-items:center;gap:7px;padding:6px 12px;border-radius:7px;
          background:var(--surface);border:1px solid var(--line);font-size:12.5px;}
  .arcbtn:hover{background:var(--surface-2);border-color:var(--line-strong);}
  .arcbtn b{font-weight:600;font-variant-numeric:tabular-nums;color:var(--dim);}
  .conn{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--faint);padding:0 2px;}
  .conn i{width:7px;height:7px;border-radius:50%;background:var(--faint);}
  .conn.on i{background:var(--s5);} .conn.off i{background:#F0806B;}

  .linkform{display:grid;grid-template-columns:150px 1fr;gap:9px 14px;align-items:center;
            background:var(--deep);border-bottom:1px solid var(--line);padding:16px 20px;flex:none;}
  .linkform label{font-size:13px;color:var(--dim);}
  .linkform input{width:100%;background:var(--bg);border:1px solid var(--line);
                  border-radius:6px;padding:8px 10px;color:var(--ink);font-size:13px;}
  .linkform .done{grid-column:1/-1;justify-self:start;background:var(--s3);color:#12202B;
                  font-weight:600;font-size:13px;padding:8px 16px;border-radius:6px;}

  /* Board */
  .board{flex:1;min-height:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));
         gap:2px;background:var(--gutter);}
  .col{display:flex;flex-direction:column;min-height:0;border-top:3px solid var(--c);
       background:linear-gradient(180deg,rgba(var(--crgb),.20) 0,rgba(var(--crgb),.075) 190px,
                  rgba(var(--crgb),.035) 100%),var(--bg);}
  .col-h{display:flex;align-items:center;gap:8px;padding:11px 13px 10px;flex:none;
         border-bottom:1px solid rgba(var(--crgb),.22);margin-bottom:10px;}
  .col-h h2{font-size:13px;font-weight:600;margin:0;letter-spacing:.01em;}
  .col-h .n{font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums;
            color:var(--c);background:rgba(var(--crgb),.16);padding:1px 7px;border-radius:20px;}
  .col-h .stg{margin-left:auto;font-size:10.5px;color:var(--faint);}
  .col-b{flex:1;min-height:0;overflow-y:auto;padding:0 11px 16px;}
  .col-b::-webkit-scrollbar{width:8px;}
  .col-b::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:4px;}

  .add{width:100%;background:transparent;border:1px dashed var(--line-strong);
       border-radius:7px;padding:9px;color:var(--dim);font-size:13px;text-align:left;margin-bottom:8px;}
  .add:hover{color:var(--ink);border-color:var(--s1);}
  .addin{width:100%;background:var(--surface);border:1px solid var(--c);border-radius:7px;
         padding:9px;color:var(--ink);font-size:13px;margin-bottom:7px;}
  .fmtrow{display:flex;gap:5px;margin-bottom:6px;}
  .fmt{font-size:11px;padding:3px 10px;border-radius:20px;border:1px solid var(--line-strong);color:var(--dim);}
  .fmt:hover{color:var(--ink);}
  .fmt.on{background:var(--c);border-color:var(--c);color:#141A26;font-weight:600;}
  .fmthint{font-size:11px;color:var(--faint);line-height:1.45;margin-bottom:9px;}

  .card{background:#3E4E67;border:1px solid rgba(248,249,250,.09);border-left:3px solid var(--c);
        border-radius:8px;padding:10px 11px;margin-bottom:8px;}
  .card:hover{background:var(--surface-2);}
  .card .head{display:flex;gap:8px;align-items:flex-start;width:100%;text-align:left;}
  .card .t{font-size:14px;line-height:1.35;flex:1;word-break:break-word;font-weight:500;}
  .card .age{font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums;flex:none;padding-top:2px;}
  .card .age.old{color:#F0B44B;}
  .meta{display:flex;gap:6px;align-items:center;margin-top:8px;flex-wrap:wrap;}
  .chip{font-size:11px;padding:2px 8px;border-radius:20px;border:1px solid var(--line-strong);color:var(--dim);}
  .chip.on{background:var(--c);border-color:var(--c);color:#141A26;font-weight:600;}
  .chip.doc{border-style:dashed;}
  .todo{font-size:11px;color:var(--faint);margin-left:auto;font-variant-numeric:tabular-nums;}
  .todo.ok{color:var(--s5);}
  .body{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);}
  .chk{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:var(--dim);
       padding:4px 0;cursor:pointer;width:100%;text-align:left;}
  .chk b{flex:none;width:14px;height:14px;border-radius:3px;border:1px solid var(--line-strong);
         margin-top:2px;font-size:10px;line-height:12px;text-align:center;color:#141A26;}
  .chk.on{color:var(--ink);} .chk.on b{background:var(--c);border-color:var(--c);}
  .acts{display:flex;gap:6px;margin-top:11px;align-items:center;flex-wrap:wrap;}
  .next{background:var(--c);color:#141A26;font-weight:600;font-size:12.5px;padding:7px 13px;border-radius:6px;}
  .ghost{font-size:12.5px;color:var(--dim);padding:7px 10px;border-radius:6px;border:1px solid var(--line);}
  .ghost:hover{color:var(--ink);border-color:var(--line-strong);}
  .del{margin-left:auto;font-size:12px;color:var(--faint);padding:7px 4px;}
  .del:hover{color:#F0806B;}
  .empty{font-size:12.5px;color:var(--faint);padding:4px 2px;line-height:1.5;}

  /* Editor */
  .ed{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;flex-direction:column;}
  .ed-top{display:flex;align-items:center;gap:14px;padding:12px 20px;flex:none;
          border-bottom:1px solid var(--line);background:var(--deep);}
  .ed-top input{flex:1;min-width:0;background:transparent;border:none;color:var(--ink);
                font-size:19px;font-weight:600;padding:5px 0;}
  .ed-top input::placeholder{color:var(--faint);}
  .ed-main{flex:1;min-height:0;display:flex;}
  .ed-write{flex:1;min-width:0;overflow-y:auto;display:flex;justify-content:center;}
  .ed-write textarea{width:100%;max-width:74ch;background:transparent;border:none;resize:none;
                     color:var(--ink);font-size:19px;line-height:1.8;padding:44px 32px 30vh;outline:none;}
  .ed-write textarea::placeholder{color:var(--faint);}
  .ed-side{width:300px;flex:none;border-left:1px solid var(--line);background:var(--deep);
           overflow-y:auto;padding:18px;}
  .ed-side h3{font-size:12px;font-weight:600;color:var(--dim);margin:0 0 10px;}
  .ed-side .grp{margin-bottom:22px;}
  .stat{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;
        border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;}
  .stat span:first-child{color:var(--dim);}
  .stat.warn span:last-child{color:#F0B44B;}
  .stat.good span:last-child{color:var(--s5);}
  .ed-side .chk{padding:8px 10px;border-radius:6px;background:rgba(248,249,250,.05);
                margin-bottom:5px;font-size:13px;line-height:1.4;}
  .ed-side .chk:hover{background:rgba(248,249,250,.11);color:var(--ink);}
  .ed-side .chk.on{background:rgba(53,165,219,.12);}
  .ed-side .next{width:100%;text-align:center;margin-bottom:7px;padding:10px;font-size:13px;}
  .ed-side .ghost{width:100%;text-align:center;padding:9px;font-size:13px;}

  /* Archiv */
  .scrim{position:fixed;inset:0;background:rgba(20,26,38,.5);z-index:39;}
  .arcv{position:fixed;top:0;right:0;bottom:0;width:340px;max-width:88vw;background:var(--deep);
        border-left:1px solid var(--line);z-index:40;display:flex;flex-direction:column;}
  .arcv-h{display:flex;align-items:center;gap:10px;padding:13px 18px;border-bottom:1px solid var(--line);flex:none;}
  .arcv-h h2{font-size:14px;font-weight:600;margin:0;}
  .arcv-h .n{font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums;}
  .arcv-h .x{margin-left:auto;font-size:12.5px;color:var(--dim);padding:6px 8px;}
  .arcv-b{flex:1;min-height:0;overflow-y:auto;padding:8px 18px 30px;}
  .arcv-g{font-size:11.5px;color:var(--faint);margin:16px 0 7px;}
  .arcv-g:first-child{margin-top:8px;}
  .arow{display:block;width:100%;text-align:left;padding:9px 11px;margin-bottom:6px;
        background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--s5);border-radius:7px;}
  .arow:hover{background:var(--surface-2);}
  .arow .t{font-size:13px;font-weight:500;line-height:1.35;}
  .arow .m{font-size:11px;color:var(--faint);margin-top:4px;}
  .arcv-e{font-size:12.5px;color:var(--faint);padding:14px 0;line-height:1.5;}

  /* Anmeldung */
  .gate{position:fixed;inset:0;z-index:80;background:var(--bg);
        display:flex;align-items:center;justify-content:center;padding:24px;}
  .gate-box{width:100%;max-width:330px;}
  .gate h2{font-size:15px;font-weight:600;margin:0 0 4px;}
  .gate p{font-size:12.5px;color:var(--faint);margin:0 0 22px;line-height:1.5;}
  .gate label{display:block;font-size:12px;color:var(--dim);margin:0 0 5px;}
  .gate input{width:100%;background:var(--surface);border:1px solid var(--line);
              border-radius:7px;padding:10px 12px;font-size:14px;color:var(--ink);margin-bottom:14px;}
  .gate input:focus{border-color:var(--s3);}
  .gate .go{width:100%;background:var(--s3);color:#12202B;font-weight:600;
            font-size:13.5px;padding:11px;border-radius:7px;}
  .gate .go:disabled{opacity:.5;cursor:default;}
  .gate .err{font-size:12.5px;color:#F0806B;margin-top:12px;min-height:17px;line-height:1.45;}

  @media (max-width:1100px){
    .board{grid-template-columns:repeat(5,minmax(200px,1fr));overflow-x:auto;}
    .ed-side{width:250px;}
  }
  @media (max-width:760px){
    .ed-side{display:none;}
    .ed-write textarea{font-size:17px;padding:24px 18px 40vh;}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;}}
</style>

<div id="app" style="visibility:hidden">
  <div class="bar">
    <div class="meter">
      <div class="count" id="cnt">0<span>/5</span></div>
      <div class="bars" id="bars"></div>
      <div class="wk"><b id="kw"></b><span id="rest"></span></div>
    </div>
    <div class="rail" id="rail"></div>
  </div>
  <div id="linkform"></div>
  <div class="board" id="board"></div>
  <div id="archive"></div>
  <div id="editor"></div>
</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

/* ═══════════════════════════════════════════════════════════
   HIER DIE ZWEI WERTE AUS SUPABASE EINTRAGEN
   Zu finden unter: Project Settings → API
   ═══════════════════════════════════════════════════════════ */
const SUPABASE_URL      = 'https://DEIN-PROJEKT.supabase.co';
const SUPABASE_ANON_KEY = 'DEIN-ANON-KEY';
/* ═══════════════════════════════════════════════════════════ */

const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const STAGES = [
  { name:'Ideen', c:'var(--s1)', rgb:'var(--s1rgb)', hint:'Hook zuerst',
    checks:['Hook in einem Satz','Passt zu Editing / Self-Improvement / Content'] },
  { name:'Scripting', c:'var(--s2)', rgb:'var(--s2rgb)', hint:'unter 60 Sek',
    checks:['Hook sitzt in den ersten 2 Sekunden','Laut gelesen, unter 60 Sek','Schluss steht','B-Roll-Bedarf notiert'] },
  { name:'Verfilmen', c:'var(--s3)', rgb:'var(--s3rgb)', hint:'4K, Safezone',
    checks:['4K aufgenommen','Augen auf etwa 2/3 Höhe','Safezone frei','Ton kontrolliert','B-Roll abgedreht'] },
  { name:'Editen', c:'var(--s4)', rgb:'var(--s4rgb)', hint:'3–5 Sek Schnitt',
    checks:['Szenenwechsel alle 3–5 Sek','B-Roll 2–3 Sek platziert','Gleiche SFX wie sonst','Captions mittig, 2–3 Fonts','Einheitlicher Colorgrade','Vignette und Blur Edges'] },
  { name:'Posten', c:'var(--s5)', rgb:'var(--s5rgb)', hint:'raus damit',
    checks:['4K exportiert','Safezone im Preview geprüft','Caption und Hashtags stehen','Überall hochgeladen'] }
];
const FCHECKS = {
  Carousel:{ 0:['Thema in einem Satz','Passt zur Nische'],
             4:['Hook steht auf Slide 1','Einheitliche Farbpalette, 2–3 Fonts','Safezone auf allen Slides geprüft','Caption und Hashtags stehen','Hochgeladen'] },
  Story:{ 0:['Thema in einem Satz','Passt zur Nische'],
          4:['Safezone frei','Text gut lesbar','Sticker oder CTA drin','Hochgeladen'] }
};
const LINKS = [
  {id:'broll',label:'B-Roll'},{id:'sfx',label:'SFX'},
  {id:'musik',label:'Musik Packs'},{id:'assets',label:'Fonts & Presets'}
];
const PEOPLE=['Uldis','Jannis'], FORMATS=['Short','Carousel','Story'], WPS=2.6;

let state={cards:[],links:{},editLinks:false,showArchive:false};
let open=null, editing=null, online=false;

function path(c){ return c.format==='Short' ? [0,1,2,3,4,5] : [0,4,5]; }
function nextOf(c){ const p=path(c),i=p.indexOf(c.stage); return (i>=0&&i<p.length-1)?p[i+1]:null; }
function prevOf(c){ const p=path(c),i=p.indexOf(c.stage); return (i>0)?p[i-1]:null; }
function checksFor(c){ const f=FCHECKS[c.format]; if(f&&f[c.stage]) return f[c.stage];
  const st=STAGES[c.stage]; return st?st.checks:[]; }
function weekKey(d){
  const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  const day=t.getUTCDay()||7; t.setUTCDate(t.getUTCDate()+4-day);
  const y0=new Date(Date.UTC(t.getUTCFullYear(),0,1));
  return t.getUTCFullYear()+'-KW'+String(Math.ceil(((t-y0)/86400000+1)/7)).padStart(2,'0');
}
const nowWeek=()=>weekKey(new Date());
const days=ts=>Math.floor((Date.now()-ts)/86400000);
const words=s=>(s||'').trim()?s.trim().split(/\s+/).length:0;
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const ARCHIVE_AFTER=7*86400000;
function archived(c){
  if(c.stage!==5) return false;
  if(c.postedAt) return (Date.now()-c.postedAt)>ARCHIVE_AFTER;
  return c.week!==nowWeek();
}
function dstr(ts){ const d=new Date(ts);
  return String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'; }

/* ---------- Datenbank ---------- */
const timers={};
function pushCard(c){
  clearTimeout(timers[c.id]);
  timers[c.id]=setTimeout(async ()=>{
    const {error}=await sb.from('cards').upsert({id:c.id,data:c,updated_at:new Date().toISOString()});
    if(error) setConn(false,'Nicht gespeichert');
  },250);
}
async function dropCard(id){ await sb.from('cards').delete().eq('id',id); }
let linkTimer;
function pushLinks(){
  clearTimeout(linkTimer);
  linkTimer=setTimeout(()=>sb.from('settings').upsert({key:'links',value:state.links}),300);
}
async function loadAll(){
  const {data:rows,error}=await sb.from('cards').select('id,data');
  if(error){ setConn(false,'Laden fehlgeschlagen'); return; }
  state.cards=(rows||[]).map(r=>({...r.data,id:r.id}))
              .sort((a,b)=>(b.created||0)-(a.created||0));
  const {data:st}=await sb.from('settings').select('value').eq('key','links').maybeSingle();
  state.links=(st&&st.value)||{};
  setConn(true);
}
function typing(){
  const a=document.activeElement;
  return a && (a.tagName==='TEXTAREA' || a.classList.contains('addin') || a.tagName==='INPUT');
}
function subscribe(){
  sb.channel('board')
    .on('postgres_changes',{event:'*',schema:'public',table:'cards'},p=>{
      if(p.eventType==='DELETE'){
        state.cards=state.cards.filter(c=>c.id!==p.old.id);
        if(editing===p.old.id) closeEditor();
      } else {
        const c={...p.new.data,id:p.new.id};
        const i=state.cards.findIndex(x=>x.id===c.id);
        if(i>=0){
          if(editing===c.id && typing()) return;   // laufende Eingabe nicht überschreiben
          state.cards[i]=c;
        } else {
          state.cards.unshift(c);
        }
      }
      if(typing() && !editing) return;
      render(); if(editing) renderEditor();
    })
    .on('postgres_changes',{event:'*',schema:'public',table:'settings'},p=>{
      if(p.new && p.new.key==='links' && !state.editLinks){ state.links=p.new.value||{}; render(); }
    })
    .subscribe(s=>{ if(s==='SUBSCRIBED') setConn(true); });
}
function setConn(ok,msg){
  online=ok;
  const el=document.getElementById('conn');
  if(el){ el.className='conn '+(ok?'on':'off');
    el.lastElementChild.textContent = ok?'live':(msg||'offline'); }
}

/* ---------- Aktionen ---------- */
function add(title,format){
  const t=title.trim(); if(!t) return;
  const c={id:'c'+Date.now()+Math.random().toString(36).slice(2,5),
    title:t,stage:0,who:'Uldis',format:format||'Short',created:Date.now(),
    checks:{},script:'',week:null,postedAt:null};
  state.cards.unshift(c); pushCard(c); render();
}
function move(c,dir){
  const n=dir>0?nextOf(c):prevOf(c);
  if(n===null) return;
  c.stage=n;
  if(n===5){ c.week=nowWeek(); c.postedAt=Date.now(); } else { c.week=null; c.postedAt=null; }
  pushCard(c); render();
}
const left=c=>checksFor(c).filter((_,i)=>!c.checks[c.stage+':'+i]).length;

/* ---------- Editor ---------- */
function openEditor(c){ editing=c.id; renderEditor(); }
function closeEditor(){ editing=null; renderEditor(); render(); }
function escKey(e){ if(e.key==='Escape'&&editing) closeEditor(); }

function renderEditor(){
  const host=document.getElementById('editor');
  const c=state.cards.find(x=>x.id===editing);
  if(!c){ host.innerHTML=''; document.removeEventListener('keydown',escKey); return; }
  document.addEventListener('keydown',escKey);
  const s=STAGES[Math.min(c.stage,4)], nStage=nextOf(c);
  const short=c.format==='Short';

  host.innerHTML=`
    <div class="ed" style="--c:${s.c}">
      <div class="ed-top">
        <input id="edtitle" value="${esc(c.title)}" placeholder="Titel oder Hook">
        <span class="chip on" style="--c:${s.c}">${s.name}</span>
        <button class="ghost" id="edclose">Schließen</button>
      </div>
      <div class="ed-main">
        <div class="ed-write">
          <textarea id="edtext" placeholder="${short?'Hook in die erste Zeile. Dann der Rest.':'Slide für Slide, oder die Caption.'}">${esc(c.script||'')}</textarea>
        </div>
        <aside class="ed-side">
          <div class="grp">
            <h3>Länge</h3>
            <div class="stat" id="stw"><span>Wörter</span><span>0</span></div>
            <div class="stat" id="sts"><span>${short?'Gesprochen':'Zeichen'}</span><span>0</span></div>
            <div class="stat"><span>Zielmarke</span><span>${short?'bis 60 Sek':'Slides / Caption'}</span></div>
          </div>
          <div class="grp"><h3>${s.name}</h3><div id="edchecks"></div></div>
          <div class="grp">
            ${nStage!==null?`<button class="next" id="ednext" style="--c:${s.c}">${nStage===5?'Als veröffentlicht markieren':'Weiter zu '+STAGES[nStage].name}</button>`:''}
            <button class="ghost" id="edclose2">Zurück zum Board</button>
          </div>
        </aside>
      </div>
    </div>`;

  const ta=host.querySelector('#edtext'), ti=host.querySelector('#edtitle');
  function stats(){
    const w=words(ta.value), sec=Math.round(w/WPS);
    host.querySelector('#stw').lastElementChild.textContent=w;
    const se=host.querySelector('#sts');
    if(short){ se.lastElementChild.textContent='~'+sec+' Sek';
      se.className='stat '+(w===0?'':(sec>60?'warn':'good')); }
    else { se.lastElementChild.textContent=ta.value.length; se.className='stat'; }
  }
  ta.addEventListener('input',()=>{c.script=ta.value;stats();pushCard(c);});
  ti.addEventListener('input',()=>{c.title=ti.value;pushCard(c);});
  stats(); ta.focus(); ta.setSelectionRange(ta.value.length,ta.value.length);

  const cw=host.querySelector('#edchecks');
  checksFor(c).forEach((txt,i)=>{
    const on=!!c.checks[c.stage+':'+i];
    const b=document.createElement('button');
    b.className='chk'+(on?' on':''); b.style.setProperty('--c',s.c);
    b.innerHTML=`<b>${on?'✓':''}</b><span>${esc(txt)}</span>`;
    b.onclick=()=>{c.checks[c.stage+':'+i]=!on;pushCard(c);renderEditor();};
    cw.appendChild(b);
  });
  host.querySelector('#edclose').onclick=closeEditor;
  host.querySelector('#edclose2').onclick=closeEditor;
  const nx=host.querySelector('#ednext');
  if(nx) nx.onclick=()=>{ move(c,1); if(c.stage>=2) closeEditor(); else renderEditor(); };
}

/* ---------- Archiv ---------- */
function renderArchive(){
  const host=document.getElementById('archive');
  if(!state.showArchive){ host.innerHTML=''; return; }
  const list=state.cards.filter(archived).sort((a,b)=>(b.postedAt||b.created)-(a.postedAt||a.created));
  const groups=[];
  list.forEach(c=>{
    const k=weekKey(new Date(c.postedAt||c.created));
    let g=groups.find(x=>x.k===k); if(!g){g={k,items:[]};groups.push(g);} g.items.push(c);
  });
  host.innerHTML=`<div class="scrim" id="arcscrim"></div>
    <div class="arcv">
      <div class="arcv-h"><h2>Archiv</h2><span class="n">${list.length}</span>
        <button class="x" id="arcx">Schließen</button></div>
      <div class="arcv-b" id="arcb"></div>
    </div>`;
  const b=host.querySelector('#arcb');
  if(!groups.length){
    const e=document.createElement('div'); e.className='arcv-e';
    e.textContent='Noch nichts archiviert. Posts landen hier automatisch sieben Tage nach der Veröffentlichung.';
    b.appendChild(e);
  }
  groups.forEach(g=>{
    const h=document.createElement('div'); h.className='arcv-g';
    h.textContent=g.k.replace('-',' · ')+'  ·  '+g.items.length+(g.items.length===1?' Post':' Posts');
    b.appendChild(h);
    g.items.forEach(c=>{
      const row=document.createElement('button'); row.className='arow';
      const sec=c.script&&c.script.trim()?(c.format==='Short'?' · ~'+Math.round(words(c.script)/WPS)+' Sek':' · Text'):'';
      row.innerHTML=`<div class="t">${esc(c.title)}</div>
        <div class="m">${dstr(c.postedAt||c.created)} · ${esc(c.format)} · ${esc(c.who)}${sec}</div>`;
      row.onclick=()=>{ state.showArchive=false; renderArchive(); openEditor(c); };
      b.appendChild(row);
    });
  });
  host.querySelector('#arcx').onclick=closeArchive;
  host.querySelector('#arcscrim').onclick=closeArchive;
  document.addEventListener('keydown',escArc);
}
function closeArchive(){ state.showArchive=false; document.removeEventListener('keydown',escArc); renderArchive(); render(); }
function escArc(e){ if(e.key==='Escape'&&state.showArchive&&!editing) closeArchive(); }

/* ---------- Board ---------- */
function render(){
  const wk=nowWeek();
  const posted=state.cards.filter(c=>c.stage===5&&c.week===wk).length;
  document.getElementById('cnt').innerHTML=posted+'<span>/5</span>';
  document.getElementById('bars').innerHTML=[0,1,2,3,4].map(i=>`<div class="bar-i ${i<posted?'on':''}"></div>`).join('');
  document.getElementById('kw').textContent=wk.split('-')[1]+' läuft';
  document.getElementById('rest').textContent=posted>=5?'Soll erfüllt.':(5-posted)+' Post'+(5-posted===1?'':'s')+' fehlen';

  const rail=document.getElementById('rail'), form=document.getElementById('linkform');
  if(state.editLinks){
    rail.innerHTML='';
    form.className='linkform';
    form.innerHTML=LINKS.map(l=>`<label for="l_${l.id}">${l.label}</label>
      <input id="l_${l.id}" type="url" placeholder="https://drive.google.com/..." value="${esc(state.links[l.id]||'')}">`).join('')
      +`<button class="done" id="linksdone">Links speichern</button>`;
    LINKS.forEach(l=>form.querySelector('#l_'+l.id).addEventListener('input',e=>{state.links[l.id]=e.target.value.trim();pushLinks();}));
    form.querySelector('#linksdone').onclick=()=>{state.editLinks=false;render();};
  } else {
    form.className=''; form.innerHTML='';
    rail.innerHTML=LINKS.map(l=>{const u=state.links[l.id];
      return u?`<a class="drv" href="${esc(u)}" target="_blank" rel="noopener"><i></i>${l.label}</a>`
              :`<span class="drv empty"><i></i>${l.label}</span>`;}).join('')
      +`<button class="lnkbtn" id="editlinks">Links bearbeiten</button>`
      +`<button class="arcbtn" id="openarc">Archiv <b>${state.cards.filter(archived).length}</b></button>`
      +`<span class="conn ${online?'on':'off'}" id="conn"><i></i><span>${online?'live':'offline'}</span></span>`
      +`<button class="lnkbtn" id="lgout">Abmelden</button>`;
    rail.querySelector('#editlinks').onclick=()=>{state.editLinks=true;render();};
    rail.querySelector('#openarc').onclick=()=>{state.showArchive=true;renderArchive();};
    rail.querySelector('#lgout').onclick=async()=>{ await sb.auth.signOut(); location.reload(); };
  }

  const board=document.getElementById('board'); board.innerHTML='';
  STAGES.forEach((s,si)=>{
    const col=document.createElement('div');
    col.className='col';
    col.style.setProperty('--c',s.c);
    col.style.setProperty('--crgb',s.rgb);
    const inStage=state.cards.filter(c=>c.stage===si);
    col.innerHTML=`<div class="col-h"><h2>${s.name}</h2><span class="n">${inStage.length}</span><span class="stg">${s.hint}</span></div>`;
    const b=document.createElement('div'); b.className='col-b';
    if(si===0) b.appendChild(adder());
    let list=inStage.slice();
    if(si===4) list=list.concat(state.cards.filter(c=>c.stage===5&&!archived(c)));
    list.forEach(c=>b.appendChild(cardEl(c)));
    if(!list.length&&si>0){
      const e=document.createElement('div'); e.className='empty';
      e.textContent=['','Nichts zu schreiben.','Kein Skript wartet auf die Kamera.','Nichts im Schnitt.','Diese Woche noch nichts raus.'][si];
      b.appendChild(e);
    }
    col.appendChild(b); board.appendChild(col);
  });
}

function adder(){
  const wrap=document.createElement('div');
  const btn=document.createElement('button');
  btn.className='add'; btn.textContent='Idee hinzufügen';
  btn.onclick=()=>{
    let fmt='Short', used=false;
    const box=document.createElement('div');
    const inp=document.createElement('input');
    inp.className='addin'; inp.placeholder='Hook oder Thema, dann Enter';
    const row=document.createElement('div'); row.className='fmtrow';
    const hint=document.createElement('div'); hint.className='fmthint';
    const setHint=()=>{ hint.textContent = fmt==='Short'
      ? 'Läuft durch Scripting, Verfilmen und Editen.' : fmt+' springt direkt zu Posten.'; };
    FORMATS.forEach(f=>{
      const b=document.createElement('button');
      b.className='fmt'+(f===fmt?' on':''); b.textContent=f;
      b.onmousedown=e=>e.preventDefault();
      b.onclick=()=>{ fmt=f; [...row.children].forEach(x=>x.className='fmt'+(x.textContent===f?' on':'')); setHint(); inp.focus(); };
      row.appendChild(b);
    });
    setHint();
    box.appendChild(inp); box.appendChild(row); box.appendChild(hint);
    wrap.replaceChild(box,btn); inp.focus();
    const commit=()=>{ if(used) return; used=true; add(inp.value,fmt); };
    const cancel=()=>{ if(used) return; used=true; render(); };
    inp.onkeydown=e=>{ if(e.key==='Enter'){e.preventDefault();commit();} if(e.key==='Escape'){cancel();} };
    inp.onblur=()=>{ setTimeout(()=>{ if(used) return; inp.value.trim()?commit():cancel(); },120); };
  };
  wrap.appendChild(btn); return wrap;
}

function cardEl(c){
  const done=c.stage===5, s=STAGES[Math.min(c.stage,4)];
  const el=document.createElement('div');
  el.className='card'; el.style.setProperty('--c',done?'var(--s5)':s.c);
  const age=days(c.created), n=done?0:left(c);

  const head=document.createElement('button');
  head.className='head';
  head.innerHTML=`<span class="t">${esc(c.title)}</span><span class="age ${age>4&&!done?'old':''}">${done?'ab':age+' T'}</span>`;
  head.onclick=()=>{open=(open===c.id)?null:c.id;render();};
  el.appendChild(head);

  const meta=document.createElement('div'); meta.className='meta';
  const who=document.createElement('button');
  who.className='chip on'; who.textContent=c.who;
  who.style.setProperty('--c', c.who==='Jannis'?'var(--j)':'var(--u)');
  who.onclick=()=>{c.who=PEOPLE[(PEOPLE.indexOf(c.who)+1)%PEOPLE.length];pushCard(c);render();};
  const fmt=document.createElement('button');
  fmt.className='chip'; fmt.textContent=c.format;
  fmt.onclick=()=>{
    c.format=FORMATS[(FORMATS.indexOf(c.format)+1)%FORMATS.length];
    if(path(c).indexOf(c.stage)<0) c.stage=0;
    pushCard(c); render();
  };
  meta.appendChild(who); meta.appendChild(fmt);
  if(c.script&&c.script.trim()){
    const d=document.createElement('button');
    d.className='chip doc'; d.textContent=c.format==='Short'?'~'+Math.round(words(c.script)/WPS)+' Sek':'Text';
    d.onclick=()=>openEditor(c); meta.appendChild(d);
  }
  const td=document.createElement('span');
  td.className='todo'+(n===0?' ok':'');
  td.textContent=done?'veröffentlicht':(n===0?'bereit':n+' offen');
  meta.appendChild(td);
  el.appendChild(meta);

  if(open===c.id){
    const b=document.createElement('div'); b.className='body';
    if(!done) checksFor(c).forEach((txt,i)=>{
      const on=!!c.checks[c.stage+':'+i];
      const row=document.createElement('button');
      row.className='chk'+(on?' on':'');
      row.innerHTML=`<b>${on?'✓':''}</b><span>${esc(txt)}</span>`;
      row.onclick=()=>{c.checks[c.stage+':'+i]=!on;pushCard(c);render();};
      b.appendChild(row);
    });
    const acts=document.createElement('div'); acts.className='acts';
    const sc=document.createElement('button');
    sc.className='next'; sc.textContent=(c.script&&c.script.trim())?'Skript öffnen':'Skript schreiben';
    sc.onclick=()=>openEditor(c); acts.appendChild(sc);
    if(!done){
      const nx=document.createElement('button');
      nx.className='ghost'; nx.textContent=c.stage===4?'Veröffentlicht':'Weiter';
      nx.onclick=()=>move(c,1); acts.appendChild(nx);
    }
    if(c.stage>0){
      const bk=document.createElement('button');
      bk.className='ghost'; bk.textContent='Zurück';
      bk.onclick=()=>move(c,-1); acts.appendChild(bk);
    }
    const dl=document.createElement('button');
    dl.className='del'; dl.textContent='Löschen';
    dl.onclick=()=>{ state.cards=state.cards.filter(x=>x.id!==c.id); open=null; dropCard(c.id); render(); };
    acts.appendChild(dl);
    b.appendChild(acts); el.appendChild(b);
  }
  return el;
}

/* ---------- Anmeldung ---------- */
async function start(){
  document.getElementById('app').style.visibility='';
  await loadAll();
  subscribe();
  render();
}

function showGate(msg){
  const g=document.createElement('div');
  g.className='gate';
  g.innerHTML=`<div class="gate-box">
      <h2>Zugang</h2>
      <p>Interner Produktionsplan.</p>
      <label for="ge_">E-Mail</label>
      <input id="ge_" type="email" autocomplete="username" autocapitalize="off" spellcheck="false">
      <label for="gp_">Passwort</label>
      <input id="gp_" type="password" autocomplete="current-password">
      <button class="go" id="gb_">Anmelden</button>
      <div class="err" id="gerr">${msg||''}</div>
    </div>`;
  document.body.appendChild(g);
  const u=g.querySelector('#ge_'), p=g.querySelector('#gp_'),
        b=g.querySelector('#gb_'), e=g.querySelector('#gerr');
  u.focus();
  async function submit(){
    e.textContent=''; b.disabled=true; b.textContent='Moment…';
    const {error}=await sb.auth.signInWithPassword({email:u.value.trim(),password:p.value});
    b.disabled=false; b.textContent='Anmelden';
    if(error){ e.textContent='Anmeldung fehlgeschlagen.'; p.value=''; p.focus(); return; }
    g.remove(); start();
  }
  b.onclick=submit;
  [u,p].forEach(el=>el.addEventListener('keydown',ev=>{ if(ev.key==='Enter') submit(); }));
}

(async ()=>{
  if(SUPABASE_URL.includes('DEIN-PROJEKT')){
    showGate('Supabase ist noch nicht eingetragen. Die zwei Werte oben in der Datei ergänzen.');
    return;
  }
  const {data}=await sb.auth.getSession();
  if(data && data.session) start(); else showGate();
})();
</script>
