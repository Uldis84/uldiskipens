<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Produktion</title>
</head>
<body>
<style>
  html,body{margin:0;padding:0;height:100%;background:#334155;overflow:hidden;color:#F8F9FA;}
  *{box-sizing:border-box;}
  button,input,textarea,select{
    font-family:'Switzer','Inter','Helvetica Neue',system-ui,-apple-system,'Segoe UI',sans-serif;
    font-size:inherit;color:inherit;background:none;border:none;margin:0;
    -webkit-appearance:none;appearance:none;
  }
  button{cursor:pointer;}
  :focus-visible{outline:2px solid #35A5DB;outline-offset:2px;border-radius:4px;}
  :root{
    --bg:#334155; --surface:#3B4A61; --surface-2:#44546E; --deep:#2A3446;
    --line:rgba(248,249,250,.13); --line-strong:rgba(248,249,250,.28);
    --ink:#F8F9FA; --dim:rgba(248,249,250,.62); --faint:rgba(248,249,250,.36);
    --brand:#302B94;
    --s1:#8B5CF6; --s2:#6366F1; --s3:#35A5DB; --s4:#1FB8A6; --s5:#35C77E;
    --s1rgb:139,92,246; --s2rgb:99,102,241; --s3rgb:53,165,219;
    --s4rgb:31,184,166; --s5rgb:53,199,126;
    --gutter:#232C3C;
    --sans:'Switzer','Inter','Helvetica Neue',system-ui,-apple-system,'Segoe UI',sans-serif;
  }
  #app{position:fixed;inset:0;display:flex;flex-direction:column;
       font-family:var(--sans);background:var(--bg);color:var(--ink);
       line-height:1.45;-webkit-font-smoothing:antialiased;}

  /* Kopfleiste */
  .bar{display:flex;align-items:center;gap:14px;padding:12px 20px;
       border-bottom:1px solid var(--line);background:var(--deep);flex:none;flex-wrap:wrap;}
  .tabs{display:flex;gap:6px;flex:none;}
  .tab{padding:9px 16px;border-radius:8px;font-size:13.5px;font-weight:600;
       background:var(--surface);border:1px solid var(--line);color:var(--dim);}
  .tab:hover{color:var(--ink);border-color:var(--line-strong);}
  .tab.on{background:var(--pc);border-color:var(--pc);color:#141A26;}
  .rail{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-left:auto;}
  .drv{display:flex;align-items:center;gap:7px;padding:6px 12px;border-radius:7px;
       background:var(--surface);border:1px solid var(--line);font-size:12.5px;
       text-decoration:none;color:var(--ink);}
  .drv:hover{background:var(--surface-2);border-color:var(--line-strong);}
  .drv i{width:6px;height:6px;border-radius:50%;background:var(--s3);flex:none;}
  .drv.empty{color:var(--dim);} .drv.empty i{background:var(--faint);}
  .lnkbtn{font-size:12.5px;color:var(--dim);padding:6px 8px;}
  .lnkbtn:hover{color:var(--ink);}
  .arcbtn{display:flex;align-items:center;gap:7px;padding:6px 12px;border-radius:7px;
          background:var(--surface);border:1px solid var(--line);font-size:12.5px;}
  .arcbtn:hover{background:var(--surface-2);border-color:var(--line-strong);}
  .arcbtn b{font-weight:600;font-variant-numeric:tabular-nums;color:var(--dim);}
  .conn{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--faint);padding:0 2px;}
  .conn i{width:7px;height:7px;border-radius:50%;background:var(--faint);}
  .conn.on i{background:var(--s5);} .conn.off i{background:#F0806B;}

  .linkform{display:grid;grid-template-columns:150px 1fr;gap:9px 14px;align-items:center;
            background:var(--deep);border-bottom:1px solid var(--line);padding:16px 20px;flex:none;}
  .linkform label{font-size:13px;color:var(--dim);}
  .linkform input{width:100%;background:var(--bg);border:1px solid var(--line);
                  border-radius:6px;padding:8px 10px;color:var(--ink);font-size:13px;}
  .linkform .done{grid-column:1/-1;justify-self:start;background:var(--s3);color:#12202B;
                  font-weight:600;font-size:13px;padding:8px 16px;border-radius:6px;}

  /* Board */
  .board{flex:1;min-height:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));
         gap:2px;background:var(--gutter);}
  .col{display:flex;flex-direction:column;min-height:0;border-top:3px solid var(--c);
       background:linear-gradient(180deg,rgba(var(--crgb),.20) 0,rgba(var(--crgb),.075) 190px,
                  rgba(var(--crgb),.035) 100%),var(--bg);}
  .col-h{display:flex;align-items:center;gap:8px;padding:11px 13px 10px;flex:none;
         border-bottom:1px solid rgba(var(--crgb),.22);margin-bottom:10px;}
  .col-h h2{font-size:13px;font-weight:600;margin:0;letter-spacing:.01em;}
  .col-h .n{font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums;
            color:var(--c);background:rgba(var(--crgb),.16);padding:1px 7px;border-radius:20px;}
  .col-h .stg{margin-left:auto;font-size:10.5px;color:var(--faint);}
  .col-b{flex:1;min-height:0;overflow-y:auto;padding:0 11px 16px;}
  .col-b::-webkit-scrollbar{width:8px;}
  .col-b::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:4px;}

  .add{width:100%;background:transparent;border:1px dashed var(--line-strong);
       border-radius:7px;padding:9px;color:var(--dim);font-size:13px;text-align:left;margin-bottom:8px;}
  .add:hover{color:var(--ink);border-color:var(--s1);}
  .addin{width:100%;background:var(--surface);border:1px solid var(--c);border-radius:7px;
         padding:9px;color:var(--ink);font-size:13px;margin-bottom:7px;}

  .card{background:#3E4E67;border:1px solid rgba(248,249,250,.09);border-left:3px solid var(--c);
        border-radius:8px;padding:10px 11px;margin-bottom:8px;}
  .card:hover{background:var(--surface-2);}
  .card .head{display:flex;gap:8px;align-items:flex-start;width:100%;text-align:left;}
  .card .t{font-size:14px;line-height:1.35;flex:1;word-break:break-word;font-weight:500;}
  .card .age{font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums;flex:none;padding-top:2px;}
  .card .age.old{color:#F0B44B;}
  .meta{display:flex;gap:6px;align-items:center;margin-top:8px;flex-wrap:wrap;}
  .chip{font-size:11px;padding:2px 8px;border-radius:20px;border:1px solid var(--line-strong);color:var(--dim);}
  .chip.on{background:var(--c);border-color:var(--c);color:#141A26;font-weight:600;}
  .chip.doc{border-style:dashed;}
  .todo{font-size:11px;color:var(--faint);margin-left:auto;font-variant-numeric:tabular-nums;}
  .todo.ok{color:var(--s5);}
  .body{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);}
  .chk{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:var(--dim);
       padding:4px 0;cursor:pointer;width:100%;text-align:left;}
  .chk b{flex:none;width:14px;height:14px;border-radius:3px;border:1px solid var(--line-strong);
         margin-top:2px;font-size:10px;line-height:12px;text-align:center;color:#141A26;}
  .chk.on{color:var(--ink);} .chk.on b{background:var(--c);border-color:var(--c);}
  .acts{display:flex;gap:6px;margin-top:11px;align-items:center;flex-wrap:wrap;}
  .next{background:var(--c);color:#141A26;font-weight:600;font-size:12.5px;padding:7px 13px;border-radius:6px;}
  .ghost{font-size:12.5px;color:var(--dim);padding:7px 10px;border-radius:6px;border:1px solid var(--line);}
  .ghost:hover{color:var(--ink);border-color:var(--line-strong);}
  .del{margin-left:auto;font-size:12px;color:var(--faint);padding:7px 4px;}
  .del:hover{color:#F0806B;}
  .empty{font-size:12.5px;color:var(--faint);padding:4px 2px;line-height:1.5;}

  /* Editor */
  .ed{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;flex-direction:column;}
  .ed-top{display:flex;align-items:center;gap:14px;padding:12px 20px;flex:none;
          border-bottom:1px solid var(--line);background:var(--deep);}
  .ed-top input{flex:1;min-width:0;background:transparent;border:none;color:var(--ink);
                font-size:19px;font-weight:600;padding:5px 0;}
  .ed-top input::placeholder{color:var(--faint);}
  .ed-main{flex:1;min-height:0;display:flex;}
  .ed-write{flex:1;min-width:0;overflow-y:auto;display:flex;justify-content:center;}
  .ed-write textarea{width:100%;max-width:74ch;background:transparent;border:none;resize:none;
                     color:var(--ink);font-size:18px;line-height:1.8;padding:30px 32px 20px;outline:none;}
  .ed-write textarea::placeholder{color:var(--faint);}
  .ed-side{width:320px;flex:none;border-left:1px solid var(--line);background:var(--deep);
           overflow-y:auto;padding:18px;}
  .ed-side h3{font-size:12px;font-weight:600;color:var(--dim);margin:0 0 10px;}
  .ed-side .grp{margin-bottom:22px;}
  .stat{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;
        border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;}
  .stat span:first-child{color:var(--dim);}
  .ed-side .chk{padding:8px 10px;border-radius:6px;background:rgba(248,249,250,.05);
                margin-bottom:5px;font-size:13px;line-height:1.4;}
  .ed-side .chk:hover{background:rgba(248,249,250,.11);color:var(--ink);}
  .ed-side .chk.on{background:rgba(53,165,219,.12);}
  .ed-side .next{width:100%;text-align:center;margin-bottom:7px;padding:10px;font-size:13px;}
  .ed-side .ghost{width:100%;text-align:center;padding:9px;font-size:13px;}

  /* KI-Recherche */
  .research{border-top:1px solid var(--line);flex:none;background:var(--deep);
            max-height:38vh;display:flex;flex-direction:column;}
  .research.collapsed{max-height:44px;}
  .research-h{display:flex;align-items:center;gap:8px;padding:11px 20px;flex:none;}
  .research-h b{font-size:13px;flex:1;}
  .research-h .hint{font-size:11.5px;color:var(--faint);}
  .research-body{padding:0 20px 16px;overflow-y:auto;min-height:0;}
  .research-row{display:flex;gap:8px;margin-bottom:10px;}
  .research-row input{flex:1;background:var(--surface);border:1px solid var(--line);
                       border-radius:7px;padding:9px 12px;font-size:13.5px;color:var(--ink);}
  .research-row button{background:var(--s3);color:#12202B;font-weight:600;font-size:13px;
                        padding:9px 14px;border-radius:7px;white-space:nowrap;}
  .research-row button:disabled{opacity:.5;cursor:default;}
  .research-out{background:var(--surface);border:1px solid var(--line);border-radius:8px;
                padding:12px 14px;font-size:13.5px;line-height:1.65;color:var(--dim);
                white-space:pre-wrap;margin-bottom:10px;}
  .research-out.loading{color:var(--faint);font-style:italic;}
  .research-insert{font-size:12px;color:var(--s3);padding:4px 0;}
  .research-note{font-size:11.5px;color:var(--faint);line-height:1.5;margin-bottom:10px;}
  .research-sources{font-size:12px;color:var(--dim);margin-bottom:10px;}
  .research-sources b{color:var(--ink);font-size:12.5px;}
  .research-sources ul{margin:6px 0 0;padding-left:18px;}
  .research-sources li{margin-bottom:4px;line-height:1.4;}
  .research-sources a{color:var(--s3);text-decoration:none;}
  .research-sources a:hover{text-decoration:underline;}
  .research-key{display:flex;gap:8px;}
  .research-key input{flex:1;background:var(--surface);border:1px solid var(--line);
                       border-radius:7px;padding:8px 10px;font-size:12.5px;color:var(--ink);}
  .research-key button{font-size:12px;padding:8px 12px;border-radius:7px;background:var(--surface-2);color:var(--dim);}

  /* Archiv */
  .scrim{position:fixed;inset:0;background:rgba(20,26,38,.5);z-index:39;}
  .arcv{position:fixed;top:0;right:0;bottom:0;width:340px;max-width:88vw;background:var(--deep);
        border-left:1px solid var(--line);z-index:40;display:flex;flex-direction:column;}
  .arcv-h{display:flex;align-items:center;gap:10px;padding:13px 18px;border-bottom:1px solid var(--line);flex:none;}
  .arcv-h h2{font-size:14px;font-weight:600;margin:0;}
  .arcv-h .n{font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums;}
  .arcv-h .x{margin-left:auto;font-size:12.5px;color:var(--dim);padding:6px 8px;}
  .arcv-b{flex:1;min-height:0;overflow-y:auto;padding:8px 18px 30px;}
  .arow{display:block;width:100%;text-align:left;padding:9px 11px;margin-bottom:6px;
        background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--s5);border-radius:7px;}
  .arow:hover{background:var(--surface-2);}
  .arow .t{font-size:13px;font-weight:500;line-height:1.35;}
  .arow .m{font-size:11px;color:var(--faint);margin-top:4px;}
  .arcv-e{font-size:12.5px;color:var(--faint);padding:14px 0;line-height:1.5;}

  /* Anmeldung */
  .gate{position:fixed;inset:0;z-index:80;background:var(--bg);
        display:flex;align-items:center;justify-content:center;padding:24px;}
  .gate-box{width:100%;max-width:330px;}
  .gate h2{font-size:15px;font-weight:600;margin:0 0 4px;}
  .gate p{font-size:12.5px;color:var(--faint);margin:0 0 22px;line-height:1.5;}
  .gate label{display:block;font-size:12px;color:var(--dim);margin:0 0 5px;}
  .gate input{width:100%;background:var(--surface);border:1px solid var(--line);
              border-radius:7px;padding:10px 12px;font-size:14px;color:var(--ink);margin-bottom:14px;}
  .gate input:focus{border-color:var(--s3);}
  .gate .go{width:100%;background:var(--s3);color:#12202B;font-weight:600;
            font-size:13.5px;padding:11px;border-radius:7px;}
  .gate .go:disabled{opacity:.5;cursor:default;}
  .gate .err{font-size:12.5px;color:#F0806B;margin-top:12px;min-height:17px;line-height:1.45;}

  @media (max-width:1100px){
    .board{grid-template-columns:repeat(5,minmax(200px,1fr));overflow-x:auto;}
    .ed-side{width:260px;}
  }
  @media (max-width:760px){
    .ed-main{flex-direction:column;}
    .ed-side{width:100%;border-left:none;border-top:1px solid var(--line);}
    .ed-write textarea{font-size:16px;padding:20px 18px;}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;}}
</style>

<div id="app" style="visibility:hidden">
  <div class="bar">
    <div class="tabs" id="tabs"></div>
    <div class="rail" id="rail"></div>
  </div>
  <div id="linkform"></div>
  <div class="board" id="board"></div>
  <div id="archive"></div>
  <div id="editor"></div>
</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

/* ═══════════════════════════════════════════════════════════
   HIER DIE ZWEI WERTE AUS SUPABASE EINTRAGEN
   Zu finden unter: Project Settings → API
   ═══════════════════════════════════════════════════════════ */
const SUPABASE_URL      = 'https://guhlzhczwxhhlbiugbfr.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_SM_ny3w1zIS-WHJwuI94wg_slnjfNpi';
/* ═══════════════════════════════════════════════════════════ */

const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* Zwei Projekte statt der alten Jannis-Personal-Brand-Pipeline */
const PROJECTS = {
  solo:       { name:'Solo-Video',           c:'var(--s3)', rgb:'var(--s3rgb)', finalLabel:'Posten' },
  wettbewerb: { name:'Geschichtswettbewerb', c:'var(--s1)', rgb:'var(--s1rgb)', finalLabel:'Einreichen' },
};
const PROJECT_ORDER = ['solo','wettbewerb'];

function stagesFor(pid){
  const p = PROJECTS[pid];
  return [
    { name:'Ideen',      c:p.c, rgb:p.rgb, hint:'Thema finden',
      checks:['Thema/Hook in einem Satz','Grober Winkel steht'] },
    { name:'Recherche & Skript', c:p.c, rgb:p.rgb, hint:'KI hilft recherchieren, du schreibst',
      checks:['Recherche abgeschlossen','Skript/Storyline selbst geschrieben','Länge grob passt'] },
    { name:'Verfilmen',  c:p.c, rgb:p.rgb, hint:'Dreh / B-Roll',
      checks:['Hauptmaterial gedreht','B-Roll abgedreht','Ton kontrolliert'] },
    { name:'Editen',     c:p.c, rgb:p.rgb, hint:'Schnitt',
      checks:['Rohschnitt steht','Sounddesign/Musik drin','Colorgrade/Look fertig'] },
    { name:p.finalLabel, c:p.c, rgb:p.rgb, hint: pid==='wettbewerb' ? 'Abgabe' : 'raus damit',
      checks: pid==='wettbewerb'
        ? ['Formale Vorgaben geprüft','Abgabe hochgeladen']
        : ['Export fertig','Titel/Thumbnail stehen','Hochgeladen'] },
  ];
}

let state={cards:[],links:{},editLinks:false,showArchive:false,activeProject:'solo'};
let open=null, editing=null, online=false;
let editorAI = { open:false, loading:false, output:'', query:'', sources:[] };

const days=ts=>Math.floor((Date.now()-ts)/86400000);
const words=s=>(s||'').trim()?s.trim().split(/\s+/).length:0;
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const ARCHIVE_AFTER=14*86400000;
function archived(c){
  const st=stagesFor(c.project);
  if(c.stage!==st.length-1) return false;
  if(c.postedAt) return (Date.now()-c.postedAt)>ARCHIVE_AFTER;
  return false;
}
function dstr(ts){ const d=new Date(ts);
  return String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'; }

/* ---------- Datenbank ---------- */
const timers={};
function pushCard(c){
  clearTimeout(timers[c.id]);
  timers[c.id]=setTimeout(async ()=>{
    const {error}=await sb.from('cards').upsert({id:c.id,data:c,updated_at:new Date().toISOString()});
    if(error) setConn(false,'Nicht gespeichert');
  },250);
}
async function dropCard(id){ await sb.from('cards').delete().eq('id',id); }
let linkTimer;
function pushLinks(){
  clearTimeout(linkTimer);
  linkTimer=setTimeout(()=>sb.from('settings').upsert({key:'links',value:state.links}),300);
}
let keyTimer;
function pushKey(){
  clearTimeout(keyTimer);
  keyTimer=setTimeout(()=>sb.from('settings').upsert({key:'geminiKey',value:{key:state.links.__aiKey||''}}),300);
}
let cseTimer;
function pushCse(){
  clearTimeout(cseTimer);
  cseTimer=setTimeout(()=>sb.from('settings').upsert({key:'cseConfig',value:{apiKey:state.links.__cseKey||'',cx:state.links.__cseId||''}}),300);
}
async function loadAll(){
  const {data:rows,error}=await sb.from('cards').select('id,data');
  if(error){ setConn(false,'Laden fehlgeschlagen'); return; }
  state.cards=(rows||[]).map(r=>({...r.data,id:r.id}))
              .filter(c=>PROJECTS[c.project]) // alte Jannis-Karten ohne gültiges Projekt ausblenden
              .sort((a,b)=>(b.created||0)-(a.created||0));
  const {data:st}=await sb.from('settings').select('value').eq('key','links').maybeSingle();
  state.links=(st&&st.value)||{};
  const {data:kk}=await sb.from('settings').select('value').eq('key','geminiKey').maybeSingle();
  state.links.__aiKey = (kk&&kk.value&&kk.value.key) || '';
  const {data:cse}=await sb.from('settings').select('value').eq('key','cseConfig').maybeSingle();
  state.links.__cseKey = (cse&&cse.value&&cse.value.apiKey) || '';
  state.links.__cseId = (cse&&cse.value&&cse.value.cx) || '';
  setConn(true);
}
function typing(){
  const a=document.activeElement;
  return a && (a.tagName==='TEXTAREA' || a.classList.contains('addin') || a.tagName==='INPUT');
}
function subscribe(){
  sb.channel('board')
    .on('postgres_changes',{event:'*',schema:'public',table:'cards'},p=>{
      if(p.eventType==='DELETE'){
        state.cards=state.cards.filter(c=>c.id!==p.old.id);
        if(editing===p.old.id) closeEditor();
      } else {
        const c={...p.new.data,id:p.new.id};
        if(!PROJECTS[c.project]) return;
        const i=state.cards.findIndex(x=>x.id===c.id);
        if(i>=0){
          if(editing===c.id && typing()) return;
          state.cards[i]=c;
        } else {
          state.cards.unshift(c);
        }
      }
      if(typing() && !editing) return;
      render(); if(editing) renderEditor();
    })
    .on('postgres_changes',{event:'*',schema:'public',table:'settings'},p=>{
      if(p.new && p.new.key==='links' && !state.editLinks){
        const aiKey = state.links.__aiKey, cseKey = state.links.__cseKey, cseId = state.links.__cseId;
        state.links=p.new.value||{}; state.links.__aiKey=aiKey; state.links.__cseKey=cseKey; state.links.__cseId=cseId; render();
      }
    })
    .subscribe(s=>{ if(s==='SUBSCRIBED') setConn(true); });
}
function setConn(ok,msg){
  online=ok;
  const el=document.getElementById('conn');
  if(el){ el.className='conn '+(ok?'on':'off');
    el.lastElementChild.textContent = ok?'live':(msg||'offline'); }
}

/* ---------- Aktionen ---------- */
function add(title, project){
  const t=title.trim(); if(!t) return;
  const c={id:'c'+Date.now()+Math.random().toString(36).slice(2,5),
    title:t, project, stage:0, checks:{}, script:'', research:'',
    created:Date.now(), postedAt:null};
  state.cards.unshift(c); pushCard(c); render();
}
function move(c,dir){
  const st=stagesFor(c.project);
  const n=c.stage+dir;
  if(n<0||n>st.length-1) return;
  c.stage=n;
  c.postedAt = (n===st.length-1) ? Date.now() : null;
  pushCard(c); render();
}
const left=c=>{
  const st=stagesFor(c.project), checks=st[c.stage].checks;
  return checks.filter((_,i)=>!c.checks[c.stage+':'+i]).length;
};

/* ---------- KI-Recherche (kostenlose Gemini API + echte Quellen via Google Custom Search) ---------- */
async function googleSearch(query){
  const apiKey = state.links.__cseKey;
  const cx = state.links.__cseId;
  if(!apiKey || !cx) return [];
  try{
    const url = 'https://www.googleapis.com/customsearch/v1?key='+encodeURIComponent(apiKey)
      +'&cx='+encodeURIComponent(cx)+'&num=5&q='+encodeURIComponent(query);
    const r = await fetch(url);
    const d = await r.json();
    if(d.error) return { error: d.error.message||JSON.stringify(d.error) };
    return (d.items||[]).map(it=>({ title: it.title, link: it.link, snippet: it.snippet||'' }));
  }catch(e){
    return { error: e && e.message ? e.message : String(e) };
  }
}

async function runResearch(c){
  const key = state.links.__aiKey;
  if(!key){
    editorAI.output = 'Kein Gemini API-Key hinterlegt. Trag ihn unten unter "KI-Key" ein (kostenlos über aistudio.google.com/apikey, einmalig).';
    renderEditor(); return;
  }
  editorAI.loading = true; editorAI.sources = []; renderEditor();

  var results = [];
  if(state.links.__cseKey && state.links.__cseId){
    var searchRes = await googleSearch(editorAI.query);
    if(searchRes && searchRes.error){
      editorAI.output = 'Fehler bei der Google-Suche: '+searchRes.error;
      editorAI.loading = false; renderEditor(); return;
    }
    results = searchRes || [];
    editorAI.sources = results;
  }

  const projectName = PROJECTS[c.project].name;
  const sys = c.project === 'wettbewerb'
    ? 'You are a research assistant for a German history-competition (Geschichtswettbewerb) video project. Gather and summarize factual historical context, sources, and concrete details the student can use — but do NOT write the script or narrative for them. Give facts, dates, and possible angles, in German, well organized with short headers. Be concise but substantive. If source snippets are provided, base your summary strictly on them and reference which numbered source each fact comes from, e.g. "(Quelle 2)".'
    : 'You are a research assistant for a cinematic solo YouTube video project. Gather and summarize factual/background research on the topic — but do NOT write the script, hook, or narrative for the student. Give facts, context, and interesting angles they could use, in German, well organized with short headers. Be concise but substantive. If source snippets are provided, base your summary strictly on them and reference which numbered source each fact comes from, e.g. "(Quelle 2)".';

  var userContent = `Projekt: ${projectName}\nTitel/Thema der Karte: ${c.title}\n\nRecherche-Frage: ${editorAI.query}`;
  if(results.length){
    userContent += '\n\nGefundene Quellen (nutze NUR diese für Fakten, zitiere mit "(Quelle N)"):\n'
      + results.map((r,i)=>`[Quelle ${i+1}] ${r.title}\n${r.link}\n${r.snippet}`).join('\n\n');
  } else if(state.links.__cseKey && state.links.__cseId){
    userContent += '\n\n(Keine Suchergebnisse gefunden — antworte aus allgemeinem Wissen und weise darauf hin, dass keine Quellen verifiziert werden konnten.)';
  }

  try{
    const r = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent', {
      method:'POST',
      headers:{'Content-Type':'application/json','x-goog-api-key':key},
      body: JSON.stringify({
        systemInstruction: { parts:[{ text: sys }] },
        contents: [{ role:'user', parts:[{ text: userContent }] }]
      })
    });
    const d = await r.json();
    if(d.error){
      editorAI.output = 'Fehler von der Gemini API: '+(d.error.message||JSON.stringify(d.error));
    } else {
      const cand = (d.candidates||[])[0];
      const txt = cand && cand.content && cand.content.parts ? cand.content.parts.map(p=>p.text||'').join('') : '';
      editorAI.output = txt || 'Keine Antwort erhalten.';
    }
  }catch(e){
    editorAI.output = 'Fehler bei der Recherche: '+(e&&e.message?e.message:e);
  }
  editorAI.loading = false; renderEditor();
}

/* ---------- Editor ---------- */
function openEditor(c){ editing=c.id; editorAI={open:false,loading:false,output:'',query:'',sources:[]}; renderEditor(); }
function closeEditor(){ editing=null; renderEditor(); render(); }
function escKey(e){ if(e.key==='Escape'&&editing) closeEditor(); }

function renderEditor(){
  const host=document.getElementById('editor');
  const c=state.cards.find(x=>x.id===editing);
  if(!c){ host.innerHTML=''; document.removeEventListener('keydown',escKey); return; }
  document.addEventListener('keydown',escKey);
  const st=stagesFor(c.project);
  const s=st[c.stage];
  const nStage = c.stage<st.length-1 ? c.stage+1 : null;

  host.innerHTML=`
    <div class="ed" style="--c:${s.c}">
      <div class="ed-top">
        <input id="edtitle" value="${esc(c.title)}" placeholder="Titel oder Thema">
        <span class="chip on" style="--c:${s.c}">${s.name}</span>
        <button class="ghost" id="edclose">Schließen</button>
      </div>
      <div class="ed-main">
        <div class="ed-write">
          <textarea id="edtext" placeholder="Dein eigenes Skript / deine eigene Storyline hier schreiben. Die KI-Recherche unten liefert nur Fakten, nicht den Text.">${esc(c.script||'')}</textarea>
        </div>
        <aside class="ed-side">
          <div class="grp">
            <h3>Länge</h3>
            <div class="stat" id="stw"><span>Wörter</span><span>0</span></div>
          </div>
          <div class="grp"><h3>${s.name}</h3><div id="edchecks"></div></div>
          <div class="grp">
            ${nStage!==null?`<button class="next" id="ednext" style="--c:${s.c}">Weiter zu ${st[nStage].name}</button>`:''}
            <button class="ghost" id="edclose2">Zurück zum Board</button>
          </div>
        </aside>
      </div>
      <div class="research ${editorAI.open?'':'collapsed'}" id="research">
        <div class="research-h">
          <b>🔍 KI-Recherche</b>
          <span class="hint">liefert Fakten, schreibt nicht dein Skript</span>
          <button class="ghost" id="research-toggle">${editorAI.open?'Einklappen':'Öffnen'}</button>
        </div>
        <div class="research-body" id="research-body" style="${editorAI.open?'':'display:none'}"></div>
      </div>
    </div>`;

  const ta=host.querySelector('#edtext'), ti=host.querySelector('#edtitle');
  function stats(){
    host.querySelector('#stw').lastElementChild.textContent = words(ta.value);
  }
  ta.addEventListener('input',()=>{c.script=ta.value;stats();pushCard(c);});
  ti.addEventListener('input',()=>{c.title=ti.value;pushCard(c);});
  stats();

  const cw=host.querySelector('#edchecks');
  s.checks.forEach((txt,i)=>{
    const on=!!c.checks[c.stage+':'+i];
    const b=document.createElement('button');
    b.className='chk'+(on?' on':''); b.style.setProperty('--c',s.c);
    b.innerHTML=`<b>${on?'✓':''}</b><span>${esc(txt)}</span>`;
    b.onclick=()=>{c.checks[c.stage+':'+i]=!on;pushCard(c);renderEditor();};
    cw.appendChild(b);
  });
  host.querySelector('#edclose').onclick=closeEditor;
  host.querySelector('#edclose2').onclick=closeEditor;
  const nx=host.querySelector('#ednext');
  if(nx) nx.onclick=()=>{ move(c,1); renderEditor(); };

  host.querySelector('#research-toggle').onclick=()=>{
    editorAI.open=!editorAI.open; renderEditor();
  };
  if(editorAI.open) renderResearchBody(c);
}

function renderResearchBody(c){
  const body=document.getElementById('research-body');
  if(!body) return;
  body.style.display='';
  const hasKey = !!(state.links.__aiKey && state.links.__aiKey.trim());
  const hasCse = !!(state.links.__cseKey && state.links.__cseKey.trim() && state.links.__cseId && state.links.__cseId.trim());
  body.innerHTML=`
    <div class="research-note">Frag nach Fakten, Quellen, historischem Kontext oder Recherche-Winkeln. Skript und Storytelling schreibst du weiterhin selbst.</div>
    ${!hasKey ? `<div class="research-key">
        <input id="ai-key" type="password" placeholder="Gemini API-Key (kostenlos: aistudio.google.com/apikey)" value="${esc(state.links.__aiKey||'')}">
        <button id="ai-key-save">Speichern</button>
      </div>` : ''}
    ${!hasCse ? `<div class="research-note">Für echte Quellenlinks (Bücher, Archive etc.) zusätzlich einrichten: <a href="https://programmablesearchengine.google.com/" target="_blank" rel="noopener" style="color:var(--s3)">Programmable Search Engine</a> erstellen (auf "das gesamte Web durchsuchen" stellen) + <a href="https://console.cloud.google.com/apis/library/customsearch.googleapis.com" target="_blank" rel="noopener" style="color:var(--s3)">Custom Search API</a> aktivieren, kostenlos bis 100 Suchen/Tag.</div>
      <div class="research-key">
        <input id="cse-key" type="password" placeholder="Custom Search API-Key" value="${esc(state.links.__cseKey||'')}">
        <input id="cse-id" type="text" placeholder="Search Engine ID (cx)" value="${esc(state.links.__cseId||'')}">
        <button id="cse-save">Speichern</button>
      </div>` : ''}
    <div class="research-row">
      <input id="research-q" placeholder="z.B. Lebensmittelversorgung Lettische SSR 1970er" value="${esc(editorAI.query)}">
      <button id="research-go" ${editorAI.loading?'disabled':''}>${editorAI.loading?'Sucht…':'Recherchieren'}</button>
    </div>
    ${editorAI.output ? `<div class="research-out ${editorAI.loading?'loading':''}">${esc(editorAI.output)}</div>
      ${editorAI.sources && editorAI.sources.length ? `<div class="research-sources"><b>Echte Quellen:</b><ul>`
        + editorAI.sources.map((s,i)=>`<li>[${i+1}] <a href="${esc(s.link)}" target="_blank" rel="noopener">${esc(s.title)}</a></li>`).join('')
        + `</ul></div>` : (hasCse ? '' : '<div class="research-note">Kein Custom-Search-Key hinterlegt — diese Antwort hat keine verifizierten Quellenlinks, nur allgemeines KI-Wissen.</div>')}
      <button class="research-insert" id="research-insert">In eigene Notizen übernehmen ↓</button>` : ''}
  `;
  const keyInput = body.querySelector('#ai-key');
  if(keyInput){
    body.querySelector('#ai-key-save').onclick=()=>{
      state.links.__aiKey = keyInput.value.trim();
      pushKey();
      renderResearchBody(c);
    };
  }
  const cseKeyInput = body.querySelector('#cse-key'), cseIdInput = body.querySelector('#cse-id');
  if(cseKeyInput){
    body.querySelector('#cse-save').onclick=()=>{
      state.links.__cseKey = cseKeyInput.value.trim();
      state.links.__cseId = cseIdInput.value.trim();
      pushCse();
      renderResearchBody(c);
    };
  }
  const qInput = body.querySelector('#research-q');
  qInput.addEventListener('input', e=>{ editorAI.query = e.target.value; });
  qInput.addEventListener('keydown', e=>{ if(e.key==='Enter' && !editorAI.loading) runResearch(c); });
  body.querySelector('#research-go').onclick=()=>runResearch(c);
  const insertBtn = body.querySelector('#research-insert');
  if(insertBtn) insertBtn.onclick=()=>{
    var sourcesText = (editorAI.sources && editorAI.sources.length)
      ? '\n\nQuellen:\n' + editorAI.sources.map((s,i)=>`[${i+1}] ${s.title} — ${s.link}`).join('\n')
      : '';
    c.research = (c.research||'') + (c.research?'\n\n---\n\n':'') + editorAI.output + sourcesText;
    pushCard(c);
    editorAI.output=''; editorAI.query=''; editorAI.sources=[];
    renderResearchBody(c);
  };
}

/* ---------- Archiv ---------- */
function renderArchive(){
  const host=document.getElementById('archive');
  if(!state.showArchive){ host.innerHTML=''; return; }
  const list=state.cards.filter(archived).sort((a,b)=>(b.postedAt||b.created)-(a.postedAt||a.created));
  host.innerHTML=`<div class="scrim" id="arcscrim"></div>
    <div class="arcv">
      <div class="arcv-h"><h2>Archiv</h2><span class="n">${list.length}</span>
        <button class="x" id="arcx">Schließen</button></div>
      <div class="arcv-b" id="arcb"></div>
    </div>`;
  const b=host.querySelector('#arcb');
  if(!list.length){
    const e=document.createElement('div'); e.className='arcv-e';
    e.textContent='Noch nichts archiviert.';
    b.appendChild(e);
  }
  list.forEach(c=>{
    const row=document.createElement('button'); row.className='arow';
    row.innerHTML=`<div class="t">${esc(c.title)}</div>
      <div class="m">${dstr(c.postedAt||c.created)} · ${esc(PROJECTS[c.project].name)}</div>`;
    row.onclick=()=>{ state.showArchive=false; renderArchive(); openEditor(c); };
    b.appendChild(row);
  });
  host.querySelector('#arcx').onclick=closeArchive;
  host.querySelector('#arcscrim').onclick=closeArchive;
  document.addEventListener('keydown',escArc);
}
function closeArchive(){ state.showArchive=false; document.removeEventListener('keydown',escArc); renderArchive(); render(); }
function escArc(e){ if(e.key==='Escape'&&state.showArchive&&!editing) closeArchive(); }

/* ---------- Board ---------- */
function render(){
  const tabs=document.getElementById('tabs');
  tabs.innerHTML='';
  PROJECT_ORDER.forEach(pid=>{
    const b=document.createElement('button');
    b.className='tab'+(state.activeProject===pid?' on':'');
    b.style.setProperty('--pc', PROJECTS[pid].c);
    b.textContent=PROJECTS[pid].name;
    b.onclick=()=>{ state.activeProject=pid; render(); };
    tabs.appendChild(b);
  });

  const rail=document.getElementById('rail'), form=document.getElementById('linkform');
  const LINKS=[{id:'broll',label:'B-Roll'},{id:'quellen',label:'Quellen'},{id:'assets',label:'Assets'}];
  if(state.editLinks){
    rail.innerHTML='';
    form.className='linkform';
    form.innerHTML=LINKS.map(l=>`<label for="l_${l.id}">${l.label}</label>
      <input id="l_${l.id}" type="url" placeholder="https://drive.google.com/..." value="${esc(state.links[l.id]||'')}">`).join('')
      +`<button class="done" id="linksdone">Links speichern</button>`;
    LINKS.forEach(l=>form.querySelector('#l_'+l.id).addEventListener('input',e=>{state.links[l.id]=e.target.value.trim();pushLinks();}));
    form.querySelector('#linksdone').onclick=()=>{state.editLinks=false;render();};
  } else {
    form.className=''; form.innerHTML='';
    rail.innerHTML=LINKS.map(l=>{const u=state.links[l.id];
      return u?`<a class="drv" href="${esc(u)}" target="_blank" rel="noopener"><i></i>${l.label}</a>`
              :`<span class="drv empty"><i></i>${l.label}</span>`;}).join('')
      +`<button class="lnkbtn" id="editlinks">Links bearbeiten</button>`
      +`<button class="arcbtn" id="openarc">Archiv <b>${state.cards.filter(archived).length}</b></button>`
      +`<span class="conn ${online?'on':'off'}" id="conn"><i></i><span>${online?'live':'offline'}</span></span>`
      +`<button class="lnkbtn" id="lgout">Abmelden</button>`;
    rail.querySelector('#editlinks').onclick=()=>{state.editLinks=true;render();};
    rail.querySelector('#openarc').onclick=()=>{state.showArchive=true;renderArchive();};
    rail.querySelector('#lgout').onclick=async()=>{ await sb.auth.signOut(); location.reload(); };
  }

  const pid = state.activeProject;
  const STAGES = stagesFor(pid);
  const board=document.getElementById('board'); board.innerHTML='';
  STAGES.forEach((s,si)=>{
    const col=document.createElement('div');
    col.className='col';
    col.style.setProperty('--c',s.c);
    col.style.setProperty('--crgb',s.rgb);
    const inStage=state.cards.filter(c=>c.project===pid && c.stage===si);
    col.innerHTML=`<div class="col-h"><h2>${s.name}</h2><span class="n">${inStage.length}</span><span class="stg">${s.hint}</span></div>`;
    const b=document.createElement('div'); b.className='col-b';
    if(si===0) b.appendChild(adder(pid));
    let list=inStage.slice();
    if(si===STAGES.length-1) list=list.concat(state.cards.filter(c=>c.project===pid && c.stage===si && !archived(c) && !inStage.includes(c)));
    list.forEach(c=>b.appendChild(cardEl(c)));
    if(!list.length&&si>0){
      const e=document.createElement('div'); e.className='empty';
      e.textContent='Noch nichts hier.';
      b.appendChild(e);
    }
    col.appendChild(b); board.appendChild(col);
  });
}

function adder(pid){
  const wrap=document.createElement('div');
  const btn=document.createElement('button');
  btn.className='add'; btn.textContent='Idee hinzufügen';
  btn.onclick=()=>{
    let used=false;
    const inp=document.createElement('input');
    inp.className='addin'; inp.placeholder='Thema oder Hook, dann Enter';
    wrap.replaceChild(inp,btn); inp.focus();
    const commit=()=>{ if(used) return; used=true; add(inp.value,pid); };
    const cancel=()=>{ if(used) return; used=true; render(); };
    inp.onkeydown=e=>{ if(e.key==='Enter'){e.preventDefault();commit();} if(e.key==='Escape'){cancel();} };
    inp.onblur=()=>{ setTimeout(()=>{ if(used) return; inp.value.trim()?commit():cancel(); },120); };
  };
  wrap.appendChild(btn); return wrap;
}

function cardEl(c){
  const st=stagesFor(c.project);
  const done=c.stage===st.length-1 && c.postedAt;
  const s=st[c.stage];
  const el=document.createElement('div');
  el.className='card'; el.style.setProperty('--c',done?'var(--s5)':s.c);
  const age=days(c.created), n=done?0:left(c);

  const head=document.createElement('button');
  head.className='head';
  head.innerHTML=`<span class="t">${esc(c.title)}</span><span class="age ${age>10&&!done?'old':''}">${done?'ab':age+' T'}</span>`;
  head.onclick=()=>{open=(open===c.id)?null:c.id;render();};
  el.appendChild(head);

  const meta=document.createElement('div'); meta.className='meta';
  if(c.script&&c.script.trim()){
    const d=document.createElement('button');
    d.className='chip doc'; d.textContent=words(c.script)+' Wörter';
    d.onclick=()=>openEditor(c); meta.appendChild(d);
  }
  if(c.research&&c.research.trim()){
    const r=document.createElement('button');
    r.className='chip doc'; r.textContent='🔍 Recherche';
    r.onclick=()=>openEditor(c); meta.appendChild(r);
  }
  const td=document.createElement('span');
  td.className='todo'+(n===0?' ok':'');
  td.textContent=done?'fertig':(n===0?'bereit':n+' offen');
  meta.appendChild(td);
  el.appendChild(meta);

  if(open===c.id){
    const b=document.createElement('div'); b.className='body';
    if(!done) s.checks.forEach((txt,i)=>{
      const on=!!c.checks[c.stage+':'+i];
      const row=document.createElement('button');
      row.className='chk'+(on?' on':'');
      row.innerHTML=`<b>${on?'✓':''}</b><span>${esc(txt)}</span>`;
      row.onclick=()=>{c.checks[c.stage+':'+i]=!on;pushCard(c);render();};
      b.appendChild(row);
    });
    const acts=document.createElement('div'); acts.className='acts';
    const sc=document.createElement('button');
    sc.className='next'; sc.textContent='Öffnen (Skript & Recherche)';
    sc.onclick=()=>openEditor(c); acts.appendChild(sc);
    if(!done && c.stage<st.length-1){
      const nx=document.createElement('button');
      nx.className='ghost'; nx.textContent='Weiter';
      nx.onclick=()=>move(c,1); acts.appendChild(nx);
    }
    if(c.stage>0){
      const bk=document.createElement('button');
      bk.className='ghost'; bk.textContent='Zurück';
      bk.onclick=()=>move(c,-1); acts.appendChild(bk);
    }
    const dl=document.createElement('button');
    dl.className='del'; dl.textContent='Löschen';
    dl.onclick=()=>{ state.cards=state.cards.filter(x=>x.id!==c.id); open=null; dropCard(c.id); render(); };
    acts.appendChild(dl);
    b.appendChild(acts); el.appendChild(b);
  }
  return el;
}

/* ---------- Anmeldung ---------- */
async function start(){
  document.getElementById('app').style.visibility='';
  await loadAll();
  subscribe();
  render();
}

function showGate(msg){
  const g=document.createElement('div');
  g.className='gate';
  g.innerHTML=`<div class="gate-box">
      <h2>Zugang</h2>
      <p>Interner Produktionsplan.</p>
      <label for="ge_">E-Mail</label>
      <input id="ge_" type="email" autocomplete="username" autocapitalize="off" spellcheck="false">
      <label for="gp_">Passwort</label>
      <input id="gp_" type="password" autocomplete="current-password">
      <button class="go" id="gb_">Anmelden</button>
      <div class="err" id="gerr">${msg||''}</div>
    </div>`;
  document.body.appendChild(g);
  const u=g.querySelector('#ge_'), p=g.querySelector('#gp_'),
        b=g.querySelector('#gb_'), e=g.querySelector('#gerr');
  u.focus();
  async function submit(){
    e.textContent=''; b.disabled=true; b.textContent='Moment…';
    const {error}=await sb.auth.signInWithPassword({email:u.value.trim(),password:p.value});
    b.disabled=false; b.textContent='Anmelden';
    if(error){ e.textContent='Anmeldung fehlgeschlagen.'; p.value=''; p.focus(); return; }
    g.remove(); start();
  }
  b.onclick=submit;
  [u,p].forEach(el=>el.addEventListener('keydown',ev=>{ if(ev.key==='Enter') submit(); }));
}

(async ()=>{
  if(SUPABASE_URL.includes('DEIN-PROJEKT')){
    showGate('Supabase ist noch nicht eingetragen. Die zwei Werte oben in der Datei ergänzen.');
    return;
  }
  const {data}=await sb.auth.getSession();
  if(data && data.session) start(); else showGate();
})();
